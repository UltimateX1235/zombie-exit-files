<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zombie Exit</title>
<style>
:root{--bg:#05070d;--ink:#e8f0ff;--acc:#ff5a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05070d}}
:root[data-theme="dark"]{--bg:#05070d}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden;user-select:none}
#root{position:relative;width:100%;height:100%}
#game,#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hid{display:none!important}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 1px 3px #000;font-size:15px}
.glass{background:linear-gradient(180deg,#0b101acc,#05080fcc);border:1px solid #ffffff26;border-radius:10px;box-shadow:0 4px 16px #0009,inset 0 1px 0 #ffffff14}
#hpbox{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;padding:8px 12px}
#hpbox .ic{color:#ff4d4d;font-size:20px}
#hpw{width:190px;height:14px;background:#1a0a0a;border:1px solid #ff4d4d66;border-radius:7px;overflow:hidden}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#b71c1c,#ff5252);transition:width .2s}
#hpn{min-width:30px;text-align:right;font-weight:bold}
#ammobox{position:absolute;left:12px;bottom:14px;padding:8px 18px 8px 14px;border-left:4px solid var(--acc)}
#wn{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
#am{font-size:36px;line-height:1.05;font-weight:bold}#amm{font-size:16px;opacity:.7}
#tr{position:absolute;right:12px;top:12px;text-align:right;line-height:1.55;padding:8px 14px}
#wp{font-weight:bold;color:#ffd23f}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;color:#fff;opacity:.85}
#cross.hit{color:#ff3b3b;font-size:34px}
#pr{position:absolute;left:50%;top:60%;transform:translateX(-50%);padding:8px 16px;font-weight:bold;color:#ffe27a;letter-spacing:1px}
#arrw{position:absolute;left:50%;top:10px;transform:translateX(-50%);text-align:center}
#arr{display:block;margin:0 auto;filter:drop-shadow(0 0 8px #ffb000aa);animation:ap 1.6s ease-in-out infinite}
@keyframes ap{50%{filter:drop-shadow(0 0 15px #ffcc40)}}
#arrr.boss #arr{filter:drop-shadow(0 0 12px #ff2a00cc);animation:none}
#dist{display:inline-block;margin-top:-2px;padding:2px 10px;border-radius:10px;background:#0a0e18aa;border:1px solid #ffffff2a;font-size:12px;letter-spacing:1px}
#bb{position:absolute;left:50%;top:104px;transform:translateX(-50%);width:min(60vw,420px);text-align:center}
#bbn{font-family:Creepster,Impact,fantasy;letter-spacing:3px;font-size:22px;color:#ff6b5a}
#bbw{height:12px;background:#1a0a0a;border:1px solid #ff4d4d88;border-radius:6px;overflow:hidden}
#bbf{height:100%;width:100%;background:linear-gradient(90deg,#7a0d0d,#ff3b3b)}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:22px;font-weight:bold;color:#fff;text-align:center;opacity:0;transition:opacity .3s;width:min(90vw,640px)}
#dmg{position:absolute;inset:0;background:radial-gradient(transparent 40%,#e00 130%);opacity:0;transition:opacity .25s}
#say{position:absolute;left:50%;top:118px;transform:translate(-50%,-8px);padding:8px 20px;border-radius:10px;background:linear-gradient(180deg,#0b101acc,#05080fcc);border:1px solid #ffffff26;opacity:0;transition:opacity .4s,transform .4s;text-align:center;max-width:80vw}
#say.on{opacity:1;transform:translate(-50%,0)}
#say.low{top:172px}
#pips{display:flex;gap:3px;margin-top:6px}
#pips i{width:6px;height:16px;border-radius:3px 3px 1px 1px;background:linear-gradient(#ffe9a0,#d8a840);display:block}
#pips i.off{background:#ffffff22}
#comm{position:absolute;right:-340px;top:158px;display:flex;gap:10px;align-items:center;padding:8px 14px 8px 8px;max-width:310px;border-radius:14px;background:linear-gradient(180deg,#0b101af0,#05080ff0);border:1px solid #7fc3ff55;box-shadow:0 4px 18px #000a,0 0 14px #2a6aff33;transition:right .45s cubic-bezier(.2,.8,.2,1)}
#comm.on{right:12px}
#mug{width:56px;height:56px;border-radius:8px;border:2px solid #7fc3ff88;image-rendering:pixelated;flex:none}
#comm b{display:block;font-size:10px;letter-spacing:3px;color:#7fc3ff;margin-bottom:2px}
#comm span{font-size:14px;line-height:1.3}
#ars{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,#0000 30%,#000a 100%);pointer-events:none}
#ars-t{font-family:Cinzel,Georgia,serif;letter-spacing:8px;font-size:18px;color:#ffd27a}
#ars-c{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ac{width:116px;padding:12px 6px;text-align:center;border:1px solid #ffffff33;border-radius:10px;background:linear-gradient(180deg,#141c2cdd,#080c14dd)}
.ac i{display:block;font-style:normal;font-size:22px;font-weight:bold;color:#ffd27a}
.ac b{display:block;font-size:12px;min-height:30px}
.ac small{opacity:.7;font-size:11px}
.ac.on{border-color:#ff5a3d;box-shadow:0 0 16px #ff5a3d77}
.ac.lk{opacity:.35}
#ars-h{font-size:12px;opacity:.8;letter-spacing:2px}
#dth{display:none;position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);width:min(88vw,480px);image-rendering:pixelated;z-index:1}
#ov.dk{background:#000}
#ov.dk #dth{display:block}
#ov.dk .fogb,#ov.dk .eyes,#ov.dk .ff{display:none}
#ov.dk #p-end{margin-top:240px}
#say b{display:block;font-size:11px;letter-spacing:3px;color:#7fc3ff;margin-bottom:2px}
#say span{font-size:17px;font-style:italic}
#cs{position:absolute;inset:0;pointer-events:none}
#cs-v{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,#000b 100%)}
.cs-b{position:absolute;left:0;right:0;background:#000;height:0;transition:height 1.4s cubic-bezier(.2,.7,.2,1)}
#cs-t1{top:0}#cs-b1{bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 6vw;overflow:hidden}
#cs.on #cs-t1{height:13vh}#cs.on #cs-b1{height:23vh}
#cs-n{font-family:Cinzel,Georgia,serif;font-weight:700;letter-spacing:6px;font-size:clamp(12px,2vw,17px);text-transform:uppercase}
#cs-x{font-family:Cinzel,Georgia,serif;font-weight:500;font-size:clamp(16px,2.8vw,30px);color:#f4efe2;text-align:center;min-height:1.3em;text-shadow:0 2px 10px #000}
#cs-x.big{color:#ff7a5a;font-size:clamp(19px,3.4vw,38px);text-shadow:0 0 18px #ff3b1a99,0 2px 10px #000}
#cs-h{font-size:12px;letter-spacing:3px;color:#ffffff99;opacity:0;transition:opacity .2s}
#cs-f{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.2s}
#cs-w{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#cs-ti{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:Creepster,Impact,fantasy;font-size:clamp(40px,9vw,110px);letter-spacing:6px;color:#ff4a2a;text-shadow:0 0 30px #ff2a00,0 0 70px #a00,0 4px 0 #000;opacity:0;transition:opacity .5s;pointer-events:none}
#cs-s{position:absolute;right:16px;top:10px;font-size:11px;letter-spacing:2px;color:#ffffff88}
#cs-x i{display:inline-block;font-style:normal;white-space:pre}
#tc{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:50}
#tc.on{opacity:1}
#tc-b{text-align:center;padding:0 6vw}
#tc-t{font-family:Cinzel,Georgia,serif;font-weight:500;font-size:clamp(22px,4.6vw,56px);letter-spacing:.3em;color:#d9d3c5;text-shadow:0 0 24px #ffffff22;opacity:0;transition:opacity 1.8s,letter-spacing 5s}
#tc-t.on{opacity:1;letter-spacing:.12em;animation:tcf 4s infinite 2s}
#tc-l{height:1px;width:0;margin:22px auto 0;background:linear-gradient(90deg,transparent,#b9b2a2,transparent);transition:width 2.4s}
#tc-l.on{width:min(62vw,460px)}
@keyframes tcf{0%,100%{opacity:1}46%{opacity:1}48%{opacity:.55}50%{opacity:1}}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#02040a40 0%,#02040ac8 80%),linear-gradient(#02040a99,#02040a22 45%,#02040add)}
.pn{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;z-index:2}
.ttl{font-family:Creepster,Impact,fantasy;font-size:clamp(44px,10vw,96px);line-height:.95;color:#e9f3d9;letter-spacing:3px;text-shadow:0 0 18px #3dff8a66,0 0 40px #ff2a2a55,0 4px 0 #0008;animation:fk 5s infinite}
@keyframes fk{0%,91%,100%{opacity:1}92%{opacity:.45}93%{opacity:1}95%{opacity:.7}96%{opacity:1}}
.sub{letter-spacing:6px;text-transform:uppercase;font-size:13px;opacity:.75;margin-bottom:14px}
.bt{font:inherit;font-weight:bold;letter-spacing:3px;text-transform:uppercase;width:min(78vw,320px);padding:13px 18px;border:1px solid #ffffff33;border-radius:6px;background:linear-gradient(180deg,#141c2ccc,#080c14cc);color:#e8f0ff;cursor:pointer;transition:.18s}
.bt:hover,.bt:focus-visible{border-color:var(--acc);box-shadow:0 0 18px #ff5a3d77,inset 0 0 12px #ff5a3d22;transform:translateX(4px);outline:none}
.bt.main{background:linear-gradient(180deg,#ff5a3d,#c2321a);border-color:#ffb199;font-size:20px;padding:15px 18px;color:#fff}
.row{width:min(88vw,430px);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff1a}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid #ffffff33;border-radius:5px;background:#0b101a;color:#cfd8ee;cursor:pointer}
.seg button.on{background:var(--acc);border-color:#ffb199;color:#fff}
input[type=range]{accent-color:var(--acc);width:160px}
.how{max-width:480px;line-height:1.55;font-size:15px}
.dd{display:block;font-size:11px;letter-spacing:1px;font-weight:normal;opacity:.75;text-transform:none;margin-top:4px}
.bt:disabled{opacity:.5;cursor:wait}
.ff{position:absolute;width:4px;height:4px;border-radius:50%;background:#c8ff7a;box-shadow:0 0 8px 2px #b6ff5a;opacity:0;animation:fl 9s infinite;z-index:1}
@keyframes fl{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}50%{transform:translate(30px,-40px)}80%{opacity:.8}100%{opacity:0;transform:translate(-20px,-90px)}}
.eyes{position:absolute;width:34px;height:8px;animation:bl 6s infinite;z-index:1}
.eyes::before,.eyes::after{content:"";position:absolute;top:0;width:10px;height:6px;border-radius:50%;background:#ffe04d;box-shadow:0 0 10px 3px #ffb300}
.eyes::before{left:0}.eyes::after{right:0}
@keyframes bl{0%,90%,100%{transform:scaleY(1);opacity:.9}93%{transform:scaleY(.05)}}
.fogb{position:absolute;left:-30%;width:160%;height:35%;background:radial-gradient(ellipse at center,#9fb4d41f,transparent 70%);animation:dr 24s linear infinite alternate;z-index:1}
@keyframes dr{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
</style>
</head>
<body>
<div id="root">
<div id="game"></div>

<div id="bb" class="hid"><div id="bbn" data-i="bossn"></div><div id="bbw"><div id="bbf"></div></div></div>

</div>

<div id="ov">

<div id="p-main" class="pn"><div class="ttl" data-i="title"></div><div class="sub" data-i="sub"></div><div class="sub hid" id="ana" data-i="ana" style="color:#ffd23f"></div>
<button class="bt main" id="b-play" data-i="play"></button><button class="bt" id="b-set" data-i="set"></button><button class="bt" id="b-how" data-i="how"></button></div>
<div id="p-set" class="pn hid"><div class="ttl" style="font-size:clamp(34px,7vw,60px)" data-i="set"></div>
